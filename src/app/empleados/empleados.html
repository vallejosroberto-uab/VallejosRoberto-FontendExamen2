<h1>Empleados</h1>

<table border="1">
  <tr>
    <th>ID</th>
    <th>Nombre</th>
    <th>Apellido</th>
    <th>Correo</th>
    <th>Salario</th>
  </tr>
  <tr *ngFor="let e of empleados">
    <td>{{ e.id }}</td>
    <td>{{ e.nombre }}</td>
    <td>{{ e.apellido }}</td>
    <td>{{ e.correo }}</td>
    <td>{{ e.salario }}</td>
  </tr>
</table>

<h2>Nuevo Empleado</h2>
<form (ngSubmit)="onSubmit()">
  <input [(ngModel)]="nuevoEmpleado.nombre" placeholder="Nombre" required />
  <input [(ngModel)]="nuevoEmpleado.apellido" placeholder="Apellido" required />
  <input [(ngModel)]="nuevoEmpleado.correo" placeholder="Correo" required />
  <input [(ngModel)]="nuevoEmpleado.salario" type="number" placeholder="Salario" required />
  <button>Agregar</button>
</form>
